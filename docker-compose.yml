
services:
  db:
    image: postgres:16-alpine
    container_name: zerogate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zerogate
      POSTGRES_PASSWORD: zerogate_secret
      POSTGRES_DB: zerogate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerogate -d zerogate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zerogate-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=ZeroGate ZTNA Simulator API
      - ENVIRONMENT=production
      - API_V1_STR=/api
      - DATABASE_URL=postgresql://zerogate:zerogate_secret@db:5432/zerogate_db
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zerogate-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
